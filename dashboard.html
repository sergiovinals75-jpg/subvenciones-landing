<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel - SubvencionesAI</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <style>
    .dashboard { padding: 100px 20px 40px; min-height: 100vh; background: var(--light); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
    .dashboard-card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
    .dashboard-card h2 { font-size: 1.1rem; margin-bottom: 20px; }
    .plan-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; }
    .plan-free { background: #E5E7EB; color: #374151; }
    .plan-basico { background: #DBEAFE; color: #1D4ED8; }
    .plan-profesional { background: #D1FAE5; color: #059669; }
    .plan-empresa { background: #FEF3C7; color: #D97706; }
    .welcome-box { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: var(--white); border-radius: 16px; padding: 40px; margin-bottom: 24px; max-width: 1200px; margin-left: auto; margin-right: auto; }
    .welcome-box h2 { color: var(--white); margin-bottom: 8px; }
    .welcome-box p { opacity: 0.9; }
    .logout-btn { background: none; border: none; color: var(--gray); cursor: pointer; font-size: 0.9rem; text-decoration: underline; }
    .logout-btn:hover { color: var(--dark); }
    .usage-item { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
    .usage-bar { height: 8px; background: var(--border); border-radius: 4px; flex: 1; margin: 0 16px; overflow: hidden; }
    .usage-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.3s; }
    .usage-text { font-size: 0.9rem; color: var(--gray); min-width: 80px; }
    .btn-simular { width: 100%; margin: 8px 0; }
    .agent-test { margin-top: 16px; }
    .agent-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .result-box { background: var(--light); border-radius: 8px; padding: 16px; white-space: pre-wrap; font-family: monospace; font-size: 0.9rem; min-height: 120px; display: none; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Subvenciones<span>AI</span></a>
      <nav class="nav" id="nav">
        <a href="index.html">Inicio</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span id="userEmail" style="color: var(--gray); font-size: 0.9rem;"></span>
        <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <div class="welcome-box">
      <h2>Bienvenido, <span id="userName"></span></h2>
      <p>Estás en el plan <strong id="currentPlanName">Gratis</strong>. Próximamente podrás buscar subvenciones con nuestro agente IA.</p>
    </div>

    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h2>Mi Plan</h2>
        <div id="planBadge" class="plan-badge plan-free">Gratis</div>
        <div id="planInfo" style="color: var(--gray); margin-bottom: 16px;">
          <p>2 búsquedas, 1 análisis, 0 PDFs por mes</p>
        </div>
        <button class="btn btn-simular" onclick="simularPago('free')">Simular Gratis</button>
        <button class="btn btn-simular btn-primary" onclick="simularPago('basico')">Simular Básico (49€)</button>
        <button class="btn btn-simular btn-primary" onclick="simularPago('profesional')">Simular Profesional (199€)</button>
        <button class="btn btn-simular" onclick="simularPago('empresa')">Simular Empresa (599€)</button>
      </div>

      <div class="dashboard-card">
        <h2>Uso este mes</h2>
        <div class="usage-item">
          <span class="usage-text">Búsquedas</span>
          <div class="usage-bar"><div class="usage-fill" id="searchesBar" style="width: 0%"></div></div>
          <span class="usage-text"><span id="searchesUsed">0</span>/<span id="searchesLimit">2</span></span>
        </div>
        <div class="usage-item">
          <span class="usage-text">Análisis</span>
          <div class="usage-bar"><div class="usage-fill" id="analysesBar" style="width: 0%"></div></div>
          <span class="usage-text"><span id="analysesUsed">0</span>/<span id="analysesLimit">1</span></span>
        </div>
        <div class="usage-item">
          <span class="usage-text">PDFs</span>
          <div class="usage-bar"><div class="usage-fill" id="pdfsBar" style="width: 0%"></div></div>
          <span class="usage-text"><span id="pdfsUsed">0</span>/<span id="pdfsLimit">0</span></span>
        </div>
        <button class="btn btn-secondary" onclick="usarBusqueda()">+ Usar 1 búsqueda</button>
        <button class="btn btn-secondary" onclick="usarAnalisis()">+ Usar 1 análisis</button>
      </div>

      <div class="dashboard-card">
        <h2>Test del Agente IA (Simulación)</h2>
        <div class="agent-test">
          <input type="text" id="agentQuery" class="agent-input" placeholder="Ej: subvenciones tecnología Madrid">
          <button class="btn btn-primary" onclick="probarAgente()">Probar Agente</button>
        </div>
        <div id="agentResult" class="result-box"></div>
      </div>
    </div>
  </main>

  <script>
    const user = localStorage.getItem('user');
    
    if (!user) {
      window.location.href = 'index.html';
    } else {
      const userData = JSON.parse(user);
      document.getElementById('userEmail').textContent = userData.email;
      document.getElementById('userName').textContent = userData.company_name || userData.email.split('@')[0];
      actualizarDashboard(userData);
    }
    
    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }
    
    function simularPago(plan) {
      const user = JSON.parse(localStorage.getItem('user'));
      user.plan = plan;
      localStorage.setItem('user', JSON.stringify(user));
      actualizarDashboard(user);
      alert('✅ Plan actualizado a ' + plan.charAt(0).toUpperCase() + plan.slice(1) + '!');
    }
    
    function actualizarDashboard(user) {
      const plans = {
        free: { name: 'Gratis', searches: 2, analyses: 1, pdfs: 0, badge: 'plan-free' },
        basico: { name: 'Básico', searches: 10, analyses: 3, pdfs: 1, badge: 'plan-basico' },
        profesional: { name: 'Profesional', searches: 50, analyses: 25, pdfs: 10, badge: 'plan-profesional' },
        empresa: { name: 'Empresa', searches: 999, analyses: 999, pdfs: 999, badge: 'plan-empresa' }
      };
      
      const plan = plans[user.plan] || plans.free;
      document.getElementById('currentPlanName').textContent = plan.name;
      document.getElementById('planBadge').textContent = plan.name;
      document.getElementById('planBadge').className = 'plan-badge ' + plan.badge;
      
      document.getElementById('planInfo').innerHTML = `
        <p>${plan.searches === 999 ? 'Ilimitadas' : plan.searches + ' búsquedas / mes'}</p>
        <p>${plan.analyses === 999 ? 'Ilimitados' : plan.analyses + ' análisis / mes'}</p>
        <p>${plan.pdfs === 999 ? 'Ilimitados' : plan.pdfs + ' PDFs / mes'}</p>
      `;
      
      const usage = JSON.parse(localStorage.getItem('usage') || '{}');
      const month = new Date().toISOString().slice(0, 7);
      const monthUsage = usage[month] || { searches: 0, analyses: 0, pdfs: 0 };
      
      document.getElementById('searchesUsed').textContent = monthUsage.searches;
      document.getElementById('analysesUsed').textContent = monthUsage.analyses;
      document.getElementById('pdfsUsed').textContent = monthUsage.pdfs;
      
      document.getElementById('searchesLimit').textContent = plan.searches === 999 ? '∞' : plan.searches;
      document.getElementById('analysesLimit').textContent = plan.analyses === 999 ? '∞' : plan.analyses;
      document.getElementById('pdfsLimit').textContent = plan.pdfs === 999 ? '∞' : plan.pdfs;
      
      const sPct = plan.searches === 999 ? 0 : Math.min((monthUsage.searches / plan.searches) * 100, 100);
      const aPct = plan.analyses === 999 ? 0 : Math.min((monthUsage.analyses / plan.analyses) * 100, 100);
      const pPct = plan.pdfs === 999 ? 0 : Math.min((monthUsage.pdfs / plan.pdfs) * 100, 100);
      
      document.getElementById('searchesBar').style.width = sPct + '%';
      document.getElementById('analysesBar').style.width = aPct + '%';
      document.getElementById('pdfsBar').style.width = pPct + '%';
    }
    
    function usarBusqueda() {
      incrementarUso('searches');
    }
    
    function usarAnalisis() {
      incrementarUso('analyses');
    }
    
    function incrementarUso(tipo) {
      const usage = JSON.parse(localStorage.getItem('usage') || '{}');
      const month = new Date().toISOString().slice(0, 7);
      if (!usage[month]) usage[month] = { searches: 0, analyses: 0, pdfs: 0 };
      usage[month][tipo]++;
      localStorage.setItem('usage', JSON.stringify(usage));
      const user = JSON.parse(localStorage.getItem('user'));
      actualizarDashboard(user);
    }
    
    async function probarAgente() {
      const query = document.getElementById('agentQuery').value;
      if (!query.trim()) return alert('Escribe una búsqueda');
      
      const resultDiv = document.getElementById('agentResult');
      resultDiv.style.display = 'block';
      resultDiv.textContent = '🔄 Buscando en fuentes reales...';
      
      try {
        const response = await fetch('http://localhost:3001/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query })
        });
        
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error || 'Error en búsqueda');
        }
        
        if (data.total === 0) {
          resultDiv.textContent = `🔍 No se encontraron resultados para: "${query}"\n\nPrueba con términos más genéricos como:\n- "subvenciones digitalización"\n- "kit digital"\n- "ayudas I+D"`;
          return;
        }
        
        let output = `✅ Encontrados ${data.total} resultados para: "${query}"\n\n`;
        data.resultados.slice(0, 5).forEach((r, i) => {
          output += `\n${i+1}. ${r.titulo}`;
          if (r.descripcion) output += `\n   ${r.descripcion.substring(0, 150)}...`;
          if (r.plazos && r.plazos.length) output += `\n   📅 Plazos: ${r.plazos.join(', ')}`;
          if (r.importe && r.importe.length) output += `\n   💰 Importe: ${r.importe.join(', ')}`;
          if (r.url) output += `\n   🔗 ${r.url}`;
          output += '\n';
        });
        
        output += `\n💡 Conectando API real con búsqueda web (Playwright + Google)`;
        resultDiv.textContent = output;
      } catch (e) {
        resultDiv.textContent = '❌ Error: ' + e.message + '\n\nVerifica que la API esté corriendo en http://localhost:3001';
      }
    }
  </script>
</body>
</html>
